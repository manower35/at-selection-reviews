<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AT SELECTION - Google Review Counter Standee (Print Ready)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: #121216;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px 15px;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Counter Acrylic Standee 4x6 / 5x7 Ratio */
  .standee {
    width: 380px;
    background: #0d0d11;
    color: #ffffff;
    border: 3px solid #d4af37;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(212,175,55,0.25);
    text-align: center;
    position: relative;
  }

  .header {
    background: linear-gradient(180deg, #1c180e 0%, #0d0d11 100%);
    padding: 24px 15px 16px;
    border-bottom: 2px solid rgba(212,175,55,0.35);
  }

  .logo-img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin-bottom: 10px;
    box-shadow: 0 4px 15px rgba(212,175,55,0.4);
    object-fit: contain;
    display: inline-block;
  }

  .brand-name {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 800;
    color: #f3e5ab;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 11px;
    font-weight: 700;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 3px;
  }

  .review-section {
    padding: 18px 20px 12px;
  }

  .google-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .g-blue { color: #4285F4; }
  .g-red { color: #EA4335; }
  .g-yellow { color: #FBBC05; }
  .g-green { color: #34A853; }

  .stars {
    color: #ffb703;
    font-size: 26px;
    letter-spacing: 4px;
    margin: 4px 0 8px;
    text-shadow: 0 0 12px rgba(255,183,3,0.6);
  }

  .cta-headline {
    font-size: 14px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  .qr-container {
    display: inline-block;
    background: #ffffff;
    padding: 14px;
    border-radius: 18px;
    border: 3px solid #d4af37;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    margin-bottom: 12px;
  }

  .qr-image {
    width: 180px;
    height: 180px;
    display: block;
    object-fit: contain;
  }

  .scan-tip {
    font-size: 12px;
    color: #f3e5ab;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  .footer {
    background: #070709;
    padding: 16px 14px;
    border-top: 1px solid rgba(212,175,55,0.25);
    font-size: 11px;
    color: #bbbbbb;
    line-height: 1.5;
  }

  .contact-highlight {
    color: #f3e5ab;
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 4px;
  }

  .phone {
    color: #25D366;
    font-weight: 700;
  }

  @media print {
    body {
      background: transparent !important;
      padding: 0 !important;
    }
    .standee {
      box-shadow: none !important;
      margin: 0 auto !important;
      page-break-inside: avoid;
    }
  }
</style>
</head>
